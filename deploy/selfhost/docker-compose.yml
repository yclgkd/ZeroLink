name: zerolink-selfhost

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20

  garage:
    image: dxflrs/garage:v2.2.0
    profiles: [storage]
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    volumes:
      - garage-data:/var/lib/garage
      - ./garage.toml:/etc/garage.toml:ro
    expose:
      - "3900"
    healthcheck:
      test:
        - CMD
        - /garage
        - stats
        - -a
      interval: 5s
      timeout: 5s
      retries: 20

  garage-init:
    image: alpine:3.21
    profiles: [storage]
    env_file:
      - path: .env
        required: true
    depends_on:
      garage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./garage-init.sh:/init.sh:ro
    restart: "no"

  migrate:
    image: ${ZEROLINK_IMAGE_REPOSITORY:-ghcr.io/yclgkd}/zerolink-api:${ZEROLINK_IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - selfhost-migrate
    restart: "no"

  api:
    image: ${ZEROLINK_IMAGE_REPOSITORY:-ghcr.io/yclgkd}/zerolink-api:${ZEROLINK_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
        required: false
    expose:
      - "8788"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8788/readyz || exit 1
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ${ZEROLINK_IMAGE_REPOSITORY:-ghcr.io/yclgkd}/zerolink-web:${ZEROLINK_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      default:
        ipv4_address: 172.30.0.2

volumes:
  postgres-data:
  garage-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
